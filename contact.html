<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Travel Recommendation</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Travel Recommendation
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact Us
            </a>

        </div>

    </nav>


    <section class="results-section">

        <h2>Contact Us</h2>

        <div class="card">

            <div class="card-content">

                <h3>Get In Touch</h3>

                <p>
                    Email:
                    travelrecommendation@example.com
                </p>

                <p>
                    Phone: +92 300 1234567
                </p>

                <br>

                <form
                    action="mailto:travelrecommendation@example.com"
                    method="post"
                    enctype="text/plain">

                    <label for="name">
                        Name
                    </label>

                    <br>

                    <input
                        type="text"
                        id="name"
                        name="Name"
                        required
                        style="width:100%;padding:12px;margin:8px 0 15px;"
                    >

                    <label for="email">
                        Email
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="Email"
                        required
                        style="width:100%;padding:12px;margin:8px 0 15px;"
                    >

                    <label for="message">
                        Message
                    </label>

                    <br>

                    <textarea
                        id="message"
                        name="Message"
                        rows="6"
                        required
                        style="width:100%;padding:12px;margin:8px 0 15px;"
                    ></textarea>

                    <button
                        type="submit"
                        style="padding:12px 25px;background:#064663;color:white;border:none;border-radius:5px;cursor:pointer;"
                    >
                        Send Email
                    </button>

                </form>

            </div>

        </div>

    </section>


    <footer>

        <p>
            © 2026 Travel Recommendation Website
        </p>

    </footer>

</body>

</html>
